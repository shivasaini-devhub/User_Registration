version: '3.8'

services:
  # NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: user_registration_backend
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./backend/.env
    environment:
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL}

  # Next.js Frontend Application Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: user_registration_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
